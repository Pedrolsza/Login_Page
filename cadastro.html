<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Criar uma nova conta</title>
</head>
<body>
  <div class="register-container">
    <h1>Criar uma nova conta</h1>
    <form action="#" method="post">
      <label for="name">Nome</label>
      <input type="text" id="name" name="name" placeholder="Nome">
      <label for="surname">Sobrenome</label>
      <input type="text" id="surname" name="surname" placeholder="Sobrenome">
      <label for="email">E-mail</label>
      <input type="text" id="email" name="email" placeholder="Email">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Nova senha">
      <label for="age">Idade</label>
      <input type="date" id="date" name="date">
      <label>Gênero</label><br>
      <input type="radio" id="masc" name="sex" value="1">
      <label for="masc">Masculino</label><br>
      <input type="radio" id="fem" name="sex" value="2">
      <label for="fem">Feminino</label><br><br>
      <button type="submit">Cadastre-se</button>
    </form>
    </div>
</body>
</html>
